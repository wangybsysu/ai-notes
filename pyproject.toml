[project]
name = "ai-notes"
version = "0.1.0"
description = "用 LLM 给本地 Markdown 笔记补摘要与标签"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-notes = "ai_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_notes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
